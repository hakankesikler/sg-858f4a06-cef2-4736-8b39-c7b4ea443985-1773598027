name: Critical Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan source for committed secrets
        run: pnpm run security:scan
      - name: Lint source
        run: pnpm run lint
      - name: Build with critical contracts
        run: pnpm run build
      - name: Test critical pages
        run: pnpm run test:smoke
